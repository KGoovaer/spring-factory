# A request body with a field the API does not know is a mistake, not something
# to drop silently: answer 400 instead (issue #20).
spring.jackson.deserialization.fail-on-unknown-properties=true

# The Exercise catalog lives in an embedded H2 file under ./data, created and
# seeded by the Flyway migrations in db/migration on startup
# (docs/adr/0009-exercises-live-in-a-database.md). Set KETTLEBELL_DB_URL to
# keep it elsewhere. Only this app opens the file, so the catalog's own locking
# is all the concurrency control it needs.
spring.datasource.url=${KETTLEBELL_DB_URL:jdbc:h2:file:./data/kettlebell}
spring.datasource.username=sa
spring.datasource.password=
# The migrations own the schema; Hibernate only checks that the entities fit it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
